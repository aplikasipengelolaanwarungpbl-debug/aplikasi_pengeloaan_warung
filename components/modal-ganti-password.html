<!-- Modal Ganti Password -->
<div class="modal fade" id="modalGantiPassword" tabindex="-1" aria-labelledby="modalGantiPasswordLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width: 400px;">
    <div class="modal-content border-0 shadow-sm rounded-4 overflow-hidden">
      <!-- Modal Header -->
      <div class="modal-header border-bottom px-4 py-3 bg-white">
        <div class="d-flex align-items-center gap-2">
          <div class="p-2 bg-primary-subtle text-primary rounded-3">
            <i data-lucide="key" class="icon-sm"></i>
          </div>
          <div>
            <h6 class="modal-title fw-bold text-dark mb-0" id="modalGantiPasswordLabel">Ganti Password</h6>
            <small class="text-muted" style="font-size: 0.75rem;">Perbarui kata sandi login akun</small>
          </div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body p-4">
        <form id="form-ganti-password" onsubmit="event.preventDefault(); saveNewPassword();">
          <div class="mb-3">
            <label for="pass-old" class="form-label small fw-semibold text-muted mb-1">Password Saat Ini <span class="text-danger">*</span></label>
            <input type="password" id="pass-old" class="form-control form-control-standard" placeholder="Masukkan password lama" required>
          </div>

          <div class="mb-3">
            <label for="pass-new" class="form-label small fw-semibold text-muted mb-1">Password Baru <span class="text-danger">*</span></label>
            <input type="password" id="pass-new" class="form-control form-control-standard" placeholder="Minimal 6 karakter" required>
          </div>

          <div class="mb-2">
            <label for="pass-confirm" class="form-label small fw-semibold text-muted mb-1">Konfirmasi Password Baru <span class="text-danger">*</span></label>
            <input type="password" id="pass-confirm" class="form-control form-control-standard" placeholder="Ulangi password baru" required>
          </div>
        </form>
      </div>

      <!-- Modal Footer -->
      <div class="modal-footer border-top bg-light px-4 py-3 d-flex justify-content-between">
        <button type="button" class="btn btn-sm btn-outline-secondary px-3 py-2 rounded-btn-sm fw-medium" data-bs-dismiss="modal">
          Batal
        </button>
        <button type="button" class="btn btn-sm btn-primary px-4 py-2 rounded-btn-sm fw-semibold d-inline-flex align-items-center gap-2 shadow-sm" onclick="saveNewPassword()">
          <i data-lucide="check" class="icon-sm"></i> Simpan Password
        </button>
      </div>
    </div>
  </div>
</div>
