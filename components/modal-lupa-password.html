<!-- Modal Lupa Password Component -->
<div class="modal fade" id="modalLupaPassword" tabindex="-1" aria-labelledby="modalLupaPasswordLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-sm rounded-4">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fs-6 fw-bold" id="modalLupaPasswordLabel">Atur Ulang Password</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
      </div>
      <form id="form-lupa-password" onsubmit="handleLupaPassword(event)">
        <div class="modal-body py-3">
          <p class="small text-muted mb-3">Masukkan email dan nomor HP yang terdaftar pada akun warung Anda untuk menerima instruksi reset password.</p>
          <div class="mb-3">
            <label for="reset-email" class="form-label small fw-semibold text-muted mb-1">Email Terdaftar</label>
            <input type="email" id="reset-email" class="form-control form-control-standard" placeholder="nama@email.com" required>
          </div>
          <div class="mb-3">
            <label for="reset-phone" class="form-label small fw-semibold text-muted mb-1">Nomor Handphone (WhatsApp)</label>
            <input type="tel" id="reset-phone" class="form-control form-control-standard" placeholder="Contoh: 081234567890" required>
          </div>
          <div id="reset-alert" class="alert alert-success d-none py-2 px-3 small rounded-3" role="alert">
            <i data-lucide="check-circle-2" class="icon-xs me-1"></i> <span id="reset-alert-text"></span>
          </div>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-light btn-standard" data-bs-dismiss="modal">Batal</button>
          <button type="submit" class="btn btn-primary btn-standard">Kirim Instruksi</button>
        </div>
      </form>
    </div>
  </div>
</div>
