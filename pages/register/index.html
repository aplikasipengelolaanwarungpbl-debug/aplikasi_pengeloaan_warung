<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Warung Baru - WarungKu</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Custom Core & Page CSS -->
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="style.css">

  <!-- Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-body-app">
  <div class="auth-container">
    <div class="auth-card p-4 p-sm-5">
      <!-- Brand Header -->
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center gap-2 mb-2">
          <img src="../../assets/image/logo.png" alt="Logo WarungKu" class="auth-brand-logo">
          <img src="../../assets/image/warungku.png" alt="WarungKu" class="auth-brand-text">
        </div>
        <h5 class="fw-bold text-dark mb-1">Daftar Warung Baru</h5>
        <p class="text-muted small mb-0">Buat akun untuk mulai mengelola warung</p>
      </div>

      <!-- Alert Notifikasi / Error State -->
      <div id="auth-alert" class="alert alert-danger d-none py-2 px-3 small rounded-3" role="alert">
        <i data-lucide="alert-circle" class="icon-xs me-1"></i> <span id="auth-alert-text"></span>
      </div>

      <!-- Form Register -->
      <form id="form-register" onsubmit="handleRegister(event)">
        <!-- Section 1: Profil Warung (tblStore) -->
        <div class="mb-3">
          <div class="d-flex align-items-center gap-1 mb-2 text-primary fw-semibold small">
            <i data-lucide="store" class="icon-xs"></i>
            <span>Informasi Warung</span>
          </div>
          <div class="mb-2">
            <label for="reg-warung-name" class="form-label small fw-semibold text-muted mb-1">Nama Warung <span class="text-danger">*</span></label>
            <input type="text" id="reg-warung-name" class="form-control form-control-standard" placeholder="Contoh: Warung Berkah Makmur" required>
          </div>
          <div class="mb-2">
            <label for="reg-warung-phone" class="form-label small fw-semibold text-muted mb-1">No. Telepon Warung <span class="text-muted fw-normal">(Opsional)</span></label>
            <input type="tel" id="reg-warung-phone" class="form-control form-control-standard" placeholder="Contoh: 021-xxxxxx / 08xxxxxx">
          </div>
          <div>
            <label for="reg-warung-address" class="form-label small fw-semibold text-muted mb-1">Alamat Warung <span class="text-muted fw-normal">(Opsional)</span></label>
            <input type="text" id="reg-warung-address" class="form-control form-control-standard" placeholder="Contoh: Jl. Merdeka No. 10">
          </div>
        </div>

        <hr class="my-3 text-muted opacity-25">

        <!-- Section 2: Akun Pemilik (tblUser) -->
        <div class="mb-3">
          <div class="d-flex align-items-center gap-1 mb-2 text-primary fw-semibold small">
            <i data-lucide="user" class="icon-xs"></i>
            <span>Data Pemilik Warung</span>
          </div>
          <div class="mb-2">
            <label for="reg-owner-name" class="form-label small fw-semibold text-muted mb-1">Nama Lengkap <span class="text-danger">*</span></label>
            <input type="text" id="reg-owner-name" class="form-control form-control-standard" placeholder="Contoh: Budi Santoso" required>
          </div>
          <div class="row g-2 mb-2">
            <div class="col-12 col-sm-6">
              <label for="reg-email" class="form-label small fw-semibold text-muted mb-1">Email <span class="text-danger">*</span></label>
              <input type="email" id="reg-email" class="form-control form-control-standard" placeholder="nama@email.com" required>
            </div>
            <div class="col-12 col-sm-6">
              <label for="reg-phone" class="form-label small fw-semibold text-muted mb-1">No. WhatsApp / HP <span class="text-danger">*</span></label>
              <input type="tel" id="reg-phone" class="form-control form-control-standard" placeholder="08123456789" required>
            </div>
          </div>
          <div class="mb-2">
            <label for="reg-username" class="form-label small fw-semibold text-muted mb-1">Username Login <span class="text-danger">*</span></label>
            <input type="text" id="reg-username" class="form-control form-control-standard" placeholder="Contoh: budisantoso" required>
          </div>
          <div class="row g-2">
            <div class="col-12 col-sm-6">
              <label for="reg-password" class="form-label small fw-semibold text-muted mb-1">Password <span class="text-danger">*</span></label>
              <input type="password" id="reg-password" class="form-control form-control-standard" placeholder="Min. 6 karakter" required>
            </div>
            <div class="col-12 col-sm-6">
              <label for="reg-confirm-password" class="form-label small fw-semibold text-muted mb-1">Konfirmasi <span class="text-danger">*</span></label>
              <input type="password" id="reg-confirm-password" class="form-control form-control-standard" placeholder="Ulangi password" required>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-standard w-100 py-2 fw-semibold mt-2">
          <i data-lucide="check-circle" class="icon-sm"></i> Daftar Warung Sekarang
        </button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
