<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - WarungKu</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Custom Core & Page CSS -->
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="style.css">

  <!-- Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-body-app">
  <div class="auth-container">
    <div class="auth-card p-4 p-sm-5">
      <!-- Brand Header -->
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center gap-2 mb-2">
          <img src="../../assets/image/logo.png" alt="Logo WarungKu" class="auth-brand-logo">
          <img src="../../assets/image/warungku.png" alt="WarungKu" class="auth-brand-text">
        </div>
        <p class="text-muted small mb-0">Masuk ke aplikasi pengelolaan warung</p>
      </div>

      <!-- Alert Notifikasi / Error State -->
      <div id="auth-alert" class="alert alert-danger d-none py-2 px-3 small rounded-3" role="alert">
        <i data-lucide="alert-circle" class="icon-xs me-1"></i> <span id="auth-alert-text"></span>
      </div>

      <!-- Form Login -->
      <form id="form-login" onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label for="login-username" class="form-label small fw-semibold text-muted mb-1">Email / No. HP</label>
          <div class="position-relative">
            <input type="text" id="login-username" class="form-control form-control-standard" placeholder="nama@email.com atau 0812xxxx" required>
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="login-password" class="form-label small fw-semibold text-muted mb-0">Password / PIN</label>
            <a href="javascript:void(0)" class="small text-primary text-decoration-none" data-bs-toggle="modal" data-bs-target="#modalLupaPassword">Lupa password?</a>
          </div>
          <div class="position-relative">
            <input type="password" id="login-password" class="form-control form-control-standard" placeholder="Masukkan password atau PIN" required>
          </div>
        </div>

        <div class="d-flex align-items-center justify-content-between mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember-me" checked>
            <label class="form-check-label small text-muted" for="remember-me">
              Ingat sesi saya
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-standard w-100 py-2 fw-semibold mb-3">
          <i data-lucide="log-in" class="icon-sm"></i> Masuk Sekarang
        </button>
      </form>

      <!-- Footer Registrasi -->
      <div class="text-center border-top pt-3 mt-3">
        <p class="small text-muted mb-0">
          Belum punya akun warung? 
          <a href="../register/index.html" class="text-primary text-decoration-none fw-semibold">Daftar Warung Baru</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Modal Container -->
  <div id="modal-lupa-password-container"></div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
